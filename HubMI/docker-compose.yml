services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:8
    # single-node replica set: needed for change streams and Atlas Search/mongot, not for transactions
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Tokens always carry issuer http://localhost:8081/realms/hubmi, no matter who asks (host or other container)
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/hubmi-realm.json:/opt/keycloak/data/import/hubmi-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          timeout --signal=KILL 2 cat <&3 | grep -q '"status": "UP"'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: "8080"
      KEYCLOAK_ISSUER: http://localhost:8081/realms/hubmi
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hubmi/protocol/openid-connect/certs
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_DATABASE: hubmi
      SEED: "true"
    ports:
      - "8080:8080"
    depends_on:
      keycloak:
        condition: service_healthy
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - server

volumes:
  postgres-data:
  mongo-data:
