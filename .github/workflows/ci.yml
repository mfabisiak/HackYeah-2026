name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The repository root is the hackathon monorepo; the project lives in HubMI/
defaults:
  run:
    working-directory: HubMI

jobs:
  backend:
    name: Backend (ktlint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: HubMI
          # by default only runs on main write the cache, so every PR starts cold
          cache-read-only: false
      - run: ./gradlew backendCheck --no-daemon
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

  web:
    name: Web (Kotlin client + React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: HubMI
          cache-read-only: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: HubMI/web/package-lock.json
      # The React app depends on the Kotlin/JS client built from :web-client
      - run: ./gradlew :web-client:ktlintCheck :web-client:jsBrowserProductionLibraryDistribution
      - run: npm ci
        working-directory: HubMI/web
      - run: npm run lint
        working-directory: HubMI/web
      - run: npm run build
        working-directory: HubMI/web
