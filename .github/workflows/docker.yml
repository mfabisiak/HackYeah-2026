name: Docker

# Compiling the server is already covered by CI; this only guards the image and compose setup.
on:
  push:
    branches: [main]
    paths:
      - HubMI/docker-compose.yml
      - HubMI/server/Dockerfile
      - HubMI/.dockerignore
      - HubMI/keycloak/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - HubMI/docker-compose.yml
      - HubMI/server/Dockerfile
      - HubMI/.dockerignore
      - HubMI/keycloak/**
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Docker compose + server image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        working-directory: HubMI
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: HubMI
          file: HubMI/server/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
