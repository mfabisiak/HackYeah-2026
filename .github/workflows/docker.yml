name: Docker

# Compiling is already covered by CI; this only guards the images and the compose setup.
on:
  push:
    branches: [main]
    paths:
      - HubMI/docker-compose.yml
      - HubMI/server/Dockerfile
      - HubMI/server/Dockerfile.dockerignore
      - HubMI/web/Dockerfile
      - HubMI/web/nginx.conf
      - HubMI/web/package-lock.json
      - HubMI/.dockerignore
      - HubMI/keycloak/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - HubMI/docker-compose.yml
      - HubMI/server/Dockerfile
      - HubMI/server/Dockerfile.dockerignore
      - HubMI/web/Dockerfile
      - HubMI/web/nginx.conf
      - HubMI/web/package-lock.json
      - HubMI/.dockerignore
      - HubMI/keycloak/**
      - .github/workflows/docker.yml

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Docker compose + images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        working-directory: HubMI
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: HubMI
          file: HubMI/server/Dockerfile
          push: false
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: HubMI
          file: HubMI/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
